<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水童設備</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:#fff; color:#1d1d1f; line-height:1.5;
  }
  a { text-decoration:none; color:#0066cc; }
  a:hover { text-decoration:underline; }

  .hero {
    max-width:1100px; margin:0 auto; padding:80px 22px 40px;
    text-align:center;
  }
  .hero h1 {
    font-size:clamp(38px,6vw,64px); font-weight:700;
    letter-spacing:-.02em;
  }
  .hero p {
    font-size:clamp(19px,2.5vw,26px); color:#6e6e73; margin-top:12px;
  }
  .hero .cta {
    display:inline-block; margin-top:24px; font-size:19px;
  }
  .hero-img {
    max-width:1100px; margin:30px auto 0; padding:0 22px;
  }
  .hero-img img {
    width:100%; border-radius:24px; display:block;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
  }

  .section {
    max-width:1100px; margin:0 auto; padding:80px 22px 30px;
  }
  .section h2 {
    font-size:clamp(28px,4vw,44px); font-weight:700;
    letter-spacing:-.02em;
  }
  .section p {
    color:#6e6e73; font-size:19px; margin-top:8px;
  }

  .grid {
    max-width:1100px; margin:30px auto 100px; padding:0 22px;
    display:grid; gap:24px;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  }
  .card {
    background:#f5f5f7; border-radius:24px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card img {
    width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
  }
  .card-body {
    padding:26px 24px 30px; text-align:center; flex:1;
    display:flex; flex-direction:column;
  }
  .tag {
    color:#bf4800; font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .card h3 {
    font-size:24px; font-weight:700; margin-top:6px;
  }
  .card .desc {
    color:#6e6e73; font-size:16px; margin-top:8px; flex:1;
  }
  .card .links {
    margin-top:18px; font-size:17px;
  }
  .card .links a { margin:0 10px; }

  footer {
    background:#f5f5f7; color:#6e6e73;
    padding:40px 22px; text-align:center; font-size:13px;
  }
</style>
</head>
<body>

<section class="hero">
  <h1>電競設備</h1>
  <a class="cta" href="#devices">查看設備細節 ›</a>
</section>


<section class="section" id="devices">
  <h2>設備細節</h2>
  <p>點選產品，查看官方規格與更多資訊。</p>
</section>

<div class="grid">

  <article class="card">
    <img src="monitor.avif" alt="AOC 24B36X 螢幕">
    <div class="card-body">
      <div class="tag">Display</div>
      <h3>AOC 24B36X</h3>
      <p class="desc">23.8 吋 螢幕，適合遊戲與日常使用。</p>
      <div class="links">
        <a href="https://www.aoc.com/me/monitors/24b36x" target="_blank" rel="noopener">查看細節 ›</a>
      </div>
    </div>
  </article>

  <article class="card">
    <img src="mouse.webp" alt="ATTACK SHARK R3 無線滑鼠">
    <div class="card-body">
      <div class="tag">Mouse</div>
      <h3>ATTACK SHARK R3</h3>
      <p class="desc">超輕量無線電競滑鼠，抵抗手腕發炎。</p>
      <div class="links">
        <a href="https://attackshark.com/products/attack-shark-r3-magnesium-alloy-wireless-gaming-mouse" target="_blank" rel="noopener">查看細節 ›</a>
      </div>
    </div>
  </article>

  <article class="card">
    <img src="keyboard.jpg" alt="MADLIONS LIGHT 60HE 磁軸鍵盤">
    <div class="card-body">
      <div class="tag">Keyboard</div>
      <h3>MADLIONS LIGHT 60HE</h3>
      <p class="desc">60% 磁軸電競鍵盤，CNC 鋁合金外殼，物理打擊設計。</p>
      <div class="links">
        <a href="https://madlionskeyboard.com/product/mad-light-60-he/" target="_blank" rel="noopener">查看細節 ›</a>
      </div>
    </div>
  </article>

</div>

<footer>
  本頁僅為個人設備展示，產品資訊與連結導向各品牌官方頁面。
</footer>

</body>
</html>
